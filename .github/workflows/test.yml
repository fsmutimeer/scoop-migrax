name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  install:
    name: scoop install
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Scoop
        shell: pwsh
        run: |
          Invoke-RestMethod get.scoop.sh -OutFile install-scoop.ps1
          .\install-scoop.ps1 -RunAsAdmin
          Add-Content $env:GITHUB_PATH "$env:USERPROFILE\scoop\shims"
      - name: Install Migrax from this commit's manifest
        shell: pwsh
        run: |
          scoop install (Join-Path $env:GITHUB_WORKSPACE 'bucket' 'migrax.json')
          migrax version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          scoop uninstall migrax
      - name: Install Migrax the way users do
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          scoop bucket add migrax https://github.com/${{ github.repository }}
          scoop install migrax/migrax
          migrax version
          if ($LASTEXITCODE -ne 0) { exit 1 }
